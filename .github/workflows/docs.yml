name: Build and deploy docs
on:
  schedule:
    - cron: "17 6 * * *"  # daily, picks up upstream Aurora docs changes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
      - name: Build
        run: ./build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: work/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # A failed build never deploys, so the last good site stays live.
  report:
    needs: [build, deploy]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the docs-build-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          DEPLOYED: ${{ needs.deploy.result == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create docs-build-failure --color B60205 --description "Docs build or deploy failed" 2>/dev/null || true
          ISSUE=$(gh issue list --label docs-build-failure --state open --json number --jq '.[0].number // empty')
          if [[ "$FAILED" == true ]]; then
            if [[ -n "$ISSUE" ]]; then
              gh issue comment "$ISSUE" --body "Failed again: $RUN_URL"
            else
              gh issue create --label docs-build-failure --title "Docs build failed" \
                --body "The live site is unchanged. See the run log for a Leftover Aurora mentions or Forbidden text list, then edit exclude.txt, rebrand.sed or allow.txt. Run: $RUN_URL"
            fi
          elif [[ -n "$ISSUE" && "$DEPLOYED" == true ]]; then
            gh issue close "$ISSUE" --comment "Fixed by $RUN_URL."
          fi
